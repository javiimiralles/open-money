services:
  - type: web
    name: open-money-backend
    runtime: node
    plan: free
    rootDir: apps/backend
    buildCommand: pnpm install && pnpm --filter backend build
    startCommand: node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      - key: API_KEY
        sync: false
      - key: CACHE_TTL_MS
        value: 300000
